<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Марми Мафия</title>
<!-- Владелец 13.10: ссылку открыли не в Chrome (Telegram, Instagram, Яндекс и др. браузеры) — без видео и меню, сразу этот экран
     (точно как экран «Открыть в Chrome» в игре). Во встроенных браузерах Telegram/Instagram страница сама пробует открыть Chrome. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; color: #e8ecf1; font-family: Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #1f2a1f 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, #24183a 0%, transparent 55%), #0f1115; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .lcard { width: min(360px, 100%); text-align: center; background: rgba(22, 26, 34, 0.86); border: 1px solid rgba(255, 213, 46, 0.25); border-radius: 22px; padding: 24px 20px 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55); }
  .licon { width: 104px; height: 104px; border-radius: 24px; display: block; margin: 0 auto 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 213, 46, 0.5); }
  .ltitle { font: 700 28px/1.1 Comfortaa, Arial, sans-serif; }
  .ltitle .a { background: linear-gradient(180deg, #8dffaa, #1fa65a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ltitle .b { background: linear-gradient(180deg, #b78cff, #5a28c8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lsub { color: #9aa3b2; font-size: 14px; margin: 6px 0 20px; }
  #go { display: block; width: 100%; border: 0; border-radius: 28px; padding: 15px; font: 700 18px Arial, sans-serif; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #5fd17a, #2f9a4f); box-shadow: 0 6px 18px rgba(47, 154, 79, 0.45); }
  #hint { color: #9aa3b2; font-size: 12px; margin: 10px 0 4px; line-height: 1.4; }
  #here { display: none; margin: 10px auto 0; background: transparent; border: 1px solid rgba(255, 255, 255, 0.22); color: #e8ecf1; border-radius: 22px; padding: 9px 22px; font: 700 14px Arial, sans-serif; cursor: pointer; }
  @media (max-height: 500px) { .licon { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 8px; } .ltitle { font-size: 22px; } .lsub { margin: 4px 0 12px; } #go { padding: 11px; font-size: 16px; } }
</style>
</head>
<body>
<div class="lcard">
  <img class="licon" src="icon-512.png?v=2" alt="">
  <div class="ltitle"><span class="a">марми</span> <span class="b">мафия</span></div>
  <div class="lsub">Змейка с друзьями и голосовым чатом</div>
  <button id="go">🌐 Открыть в Chrome</button>
  <div id="hint">В Chrome игру можно установить на телефон одним нажатием</div>
  <button id="here">Играть здесь</button>
</div>
<script>
(function () {
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua);
  var q = location.search.replace(/[?&]here=1/, '').replace(/^&/, '?');
  var url = location.origin + '/' + q;
  var go = document.getElementById('go'), hint = document.getElementById('hint'), here = document.getElementById('here');
  here.onclick = function () { location.replace('/' + (q ? q + '&' : '?') + 'here=1'); };
  if (ios) {
    go.textContent = '🧭 Открыть в Safari';
    hint.textContent = 'В Safari игру можно установить на телефон';
  }
  function open(auto) {
    if (!ios) { // Android: сразу Chrome; нет Chrome — игра откроется здесь же
      location.href = 'intent://' + location.host + '/' + q + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(location.origin + '/' + (q ? q + '&' : '?') + 'here=1') + ';end';
      return;
    }
    // iPhone (iOS 17+): x-safari-https:// открывает Safari из Telegram/Instagram. Ссылку заодно копируем — на старых iPhone вставить в Safari
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url); } catch (e) {}
    location.href = 'x-safari-' + url;
    if (auto === true) return; // сама попытка — без надписей
    setTimeout(function () {
      if (document.hidden) return;
      go.textContent = '📋 Ссылка скопирована';
      hint.innerHTML = 'Откройте <b>Safari</b>, нажмите на адресную строку и вставьте ссылку';
      here.style.display = 'block';
    }, 1500);
  }
  go.onclick = function () { open(false); };
  // Сами пробуем только там, где точно умеют передавать ссылку в браузер (Telegram, Instagram, Facebook); на iPhone — с iOS 17
  var known = !!window.TelegramWebviewProxy || /Telegram|Instagram|FBAN|FBAV|FB_IAB/i.test(ua), iosVer = +((ua.match(/OS (\d+)_/) || [])[1] || 0);
  if (known && (!ios || iosVer >= 17)) setTimeout(function () { open(true); }, 350); // пробуем открыть сами, без нажатия; если телефон не разрешил — остаётся кнопка
})();
</script>
</body>
</html>
