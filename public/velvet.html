<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Марми Мафия — бархатные змеи (проба)</title>
<style>
  html, body { margin: 0; background: #0b1018; font-family: Arial, sans-serif; color: #e8ecf1; }
  canvas { display: block; margin: 0 auto; }
  #hint { text-align: center; color: #8a93a8; font-size: 13px; padding: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Бархатные змеи — проба (владелец 07.10). В игре пока ничего не изменилось.</div>
<script>
// Тот же «бархат», что у пробного Дона (don.html): гладкая трубка, мелкая чешуя, блик, линии по бокам, узор по хребту, голова клином
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), TAU = Math.PI * 2;
const V = [
  { name: '1. Бордовый бархат', base: '#2a0710', mid: '#4a0f1e', line: '#d4a73a', eye: '#ffd52e', pat: 'diamond', pc: ['#fff1a8', '#ffd52e', '#b8860b', '#6b4a05'] },
  { name: '2. Изумрудный (Комиссар)', base: '#04261a', mid: '#0b4a32', line: '#c9d6df', eye: '#7df9ff', pat: 'diamond', pc: ['#ffffff', '#c9d6df', '#8a99a8', '#3d4a57'] },
  { name: '3. Ночной синий (Шериф)', base: '#0a1430', mid: '#1a2c5c', line: '#e8c25a', eye: '#ffd52e', pat: 'star', pc: ['#fff6c0', '#ffd52e', '#c8961a', '#6b4a05'] },
  { name: '4. Сталь и кровь (Киллер)', base: '#1c1f24', mid: '#3a3f47', line: '#d01f2e', eye: '#ff3b3b', pat: 'stripe', pc: ['#ff6b6b', '#d01f2e', '#8a0c16', '#3d0207'] },
  { name: '5. Белый бархат (Доктор)', base: '#bfc4cc', mid: '#f2f3f5', line: '#e0303f', eye: '#3ddc5a', pat: 'cross', pc: ['#ff8a8a', '#e0303f', '#a3121f', '#5c0710'] },
  { name: '6. Розовый бархат (Проститутка)', base: '#5c0a33', mid: '#c2185b', line: '#ffd1e6', eye: '#ff9ad1', pat: 'heart', pc: ['#ffffff', '#ffd1e6', '#ff8ac0', '#a3125a'] },
];
const COLS = innerWidth < 700 ? 1 : 2, CW = Math.min(560, innerWidth / COLS - 10), CH = 230, DPR = Math.min(2, devicePixelRatio || 1);
cv.width = CW * COLS * DPR; cv.height = CH * Math.ceil(V.length / COLS) * DPR; cv.style.width = CW * COLS + 'px'; cv.style.height = CH * Math.ceil(V.length / COLS) + 'px';
// мелкая чешуя
const scaleC = document.createElement('canvas'); scaleC.width = 24; scaleC.height = 20; (() => { const g = scaleC.getContext('2d');
  for (const [x, y] of [[0, 0], [24, 0], [12, 10], [0, 20], [24, 20]]) { const gr = g.createRadialGradient(x - 2, y - 3, 1, x, y, 11); gr.addColorStop(0, 'rgba(255,255,255,0.22)'); gr.addColorStop(0.75, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.5)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, 12, 10, 0, 0, TAU); g.fill(); } })();
const scaleP = ctx.createPattern(scaleC, 'repeat');
function strokeOffset(P, off, width, style) { ctx.beginPath(); P.forEach(([x, y, a], i) => { const ox = x - Math.sin(a) * off, oy = y + Math.cos(a) * off; i ? ctx.lineTo(ox, oy) : ctx.moveTo(ox, oy); }); ctx.lineWidth = width; ctx.strokeStyle = style; ctx.stroke(); }
function grad(sz, c) { const gr = ctx.createLinearGradient(-sz, -sz, sz, sz); gr.addColorStop(0, c[0]); gr.addColorStop(0.4, c[1]); gr.addColorStop(0.8, c[2]); gr.addColorStop(1, c[3]); return gr; }
function mark(v, sz, t, k) { // узор по хребту
  ctx.fillStyle = grad(sz, v.pc); ctx.strokeStyle = 'rgba(30,15,0,0.7)'; ctx.lineWidth = Math.max(1, sz * 0.08);
  ctx.beginPath();
  if (v.pat === 'diamond') { ctx.moveTo(sz * 1.1, 0); ctx.lineTo(0, sz * 0.62); ctx.lineTo(-sz * 1.1, 0); ctx.lineTo(0, -sz * 0.62); }
  else if (v.pat === 'star') { for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5, rr = i % 2 ? sz * 0.32 : sz * 0.78; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } }
  else if (v.pat === 'stripe') { ctx.rect(-sz * 0.22, -sz * 1.25, sz * 0.44, sz * 2.5); }
  else if (v.pat === 'cross') { const a = sz * 0.22, b = sz * 0.7; ctx.moveTo(-a, -b); ctx.lineTo(a, -b); ctx.lineTo(a, -a); ctx.lineTo(b, -a); ctx.lineTo(b, a); ctx.lineTo(a, a); ctx.lineTo(a, b); ctx.lineTo(-a, b); ctx.lineTo(-a, a); ctx.lineTo(-b, a); ctx.lineTo(-b, -a); ctx.lineTo(-a, -a); }
  else if (v.pat === 'heart') { const s = sz * 0.75; ctx.moveTo(-s * 0.9, 0); ctx.bezierCurveTo(-s * 0.2, -s * 1.1, s * 0.9, -s * 0.7, s * 0.25, 0); ctx.bezierCurveTo(s * 0.9, s * 0.7, -s * 0.2, s * 1.1, -s * 0.9, 0); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  if (v.pat === 'diamond') { ctx.fillStyle = v.base; ctx.beginPath(); ctx.moveTo(sz * 0.42, 0); ctx.lineTo(0, sz * 0.22); ctx.lineTo(-sz * 0.42, 0); ctx.lineTo(0, -sz * 0.22); ctx.closePath(); ctx.fill(); }
  if (((t * 0.0006 + k) % 1) < 0.08) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill(); } // бегущий блеск
}
function drawSnake(v, ox, oy, t) {
  const R = 20, len = R * 22, step = 3, P = [];
  for (let d = 0; d <= len; d += step) { // волна: голова справа, тело изгибается змейкой
    const x = ox + CW - 80 - d, y = oy + CH * 0.45 + Math.sin(d * 0.018 - t * 0.002) * 26;
    const x2 = x - 1, y2 = oy + CH * 0.45 + Math.sin((d + 1) * 0.018 - t * 0.002) * 26;
    P.push([x, y, Math.atan2(y - y2, x - x2)]);
  }
  const N = P.length;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.save(); ctx.translate(R * 0.25, R * 0.35); strokeOffset(P, 0, R * 2.1, 'rgba(0,0,0,0.45)'); ctx.restore(); // тень
  for (let s = 0; s < N - 1; s += 3) { const part = P.slice(s, Math.min(N, s + 4)), k = s / N, w = R * 2 * (k < 0.55 ? 1 : Math.max(0.12, 1 - (k - 0.55) / 0.45 * 0.88));
    strokeOffset(part, 0, w, v.base); strokeOffset(part, 0, w * 0.78, v.mid); strokeOffset(part, -w * 0.18, w * 0.22, 'rgba(255,255,255,0.12)');
    ctx.save(); ctx.globalAlpha = 0.55; strokeOffset(part, 0, w, scaleP); ctx.restore(); }
  for (let s = 0; s < N - 1; s += 3) { const part = P.slice(s, Math.min(N, s + 4)), k = s / N, w = R * 2 * (k < 0.55 ? 1 : Math.max(0.12, 1 - (k - 0.55) / 0.45 * 0.88));
    strokeOffset(part, w * 0.40, Math.max(1, w * 0.05), v.line); strokeOffset(part, -w * 0.40, Math.max(1, w * 0.05), v.line); }
  for (let i = Math.round(R * 2.2 / 3); i < N - 6; i += Math.round(R * 1.15)) { const [x, y, a] = P[i], k = i / N, sz = R * 0.62 * (k < 0.55 ? 1 : Math.max(0.2, 1 - (k - 0.55) / 0.45));
    ctx.save(); ctx.translate(x, y); ctx.rotate(a); mark(v, sz, t, k); ctx.restore(); }
  // голова клином
  const [hx, hy, ang] = P[0];
  ctx.save(); ctx.translate(hx + Math.cos(ang) * R * 0.25, hy + Math.sin(ang) * R * 0.25); ctx.rotate(ang);
  const hg = ctx.createRadialGradient(-R * 0.2, -R * 0.35, R * 0.1, 0, 0, R * 1.4); hg.addColorStop(0, v.mid); hg.addColorStop(1, v.base);
  ctx.fillStyle = hg; ctx.beginPath(); ctx.moveTo(-R * 0.9, -R * 0.95); ctx.quadraticCurveTo(R * 0.6, -R * 1.15, R * 1.35, -R * 0.35); ctx.quadraticCurveTo(R * 1.6, 0, R * 1.35, R * 0.35);
  ctx.quadraticCurveTo(R * 0.6, R * 1.15, -R * 0.9, R * 0.95); ctx.quadraticCurveTo(-R * 1.25, 0, -R * 0.9, -R * 0.95); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = v.line; ctx.lineWidth = Math.max(1, R * 0.06); ctx.stroke();
  for (const sg of [-1, 1]) { const ex = R * 0.55, ey = sg * R * 0.56;
    ctx.save(); ctx.shadowColor = v.eye; ctx.shadowBlur = R * 0.6; const eg = ctx.createRadialGradient(ex - R * 0.06, ey - R * 0.06, 1, ex, ey, R * 0.3); eg.addColorStop(0, '#ffffff'); eg.addColorStop(0.6, v.eye); eg.addColorStop(1, '#222');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(ex, ey, R * 0.3, 0, TAU); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#0a0a0a'; ctx.beginPath(); ctx.ellipse(ex + R * 0.04, ey, R * 0.06, R * 0.22, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(ex - R * 0.1, ey - R * 0.1, R * 0.06, 0, TAU); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = '#c9cfd8'; ctx.font = 'bold 15px Arial'; ctx.fillText(v.name, ox + 14, oy + CH - 18);
}
function frame(t) {
  requestAnimationFrame(frame);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#0b1018'; ctx.fillRect(0, 0, CW * COLS, CH * 3);
  V.forEach((v, i) => { const ox = (i % COLS) * CW, oy = Math.floor(i / COLS) * CH; ctx.fillStyle = '#121a26'; ctx.fillRect(ox + 4, oy + 4, CW - 8, CH - 8); drawSnake(v, ox, oy, t); });
}
requestAnimationFrame(frame);
</script>
</body>
</html>
